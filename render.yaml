# Render Blueprint — Deck Score
# Deploy: Dashboard → New → Blueprint → deck-backend repo
# Validate: render blueprints validate ./render.yaml

services:
  # ── Backend API + Socket.io ──────────────────────────────────────────────
  - type: web
    name: deck-backend
    runtime: node
    plan: free
    repo: https://github.com/NikhithaBommali/deck-backend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: deck-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Vite static site — always on CDN) ────────────────────────────
  - type: web
    name: deck-frontend
    runtime: static
    repo: https://github.com/NikhithaBommali/deck-frontend
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: deck-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        fromService:
          type: web
          name: deck-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_URL
        fromService:
          type: web
          name: deck-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Keep-alive: use .github/workflows/keepalive.yml (Render cron is not free tier)
