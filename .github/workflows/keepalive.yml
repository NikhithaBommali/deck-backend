# Free backup keep-alive (runs every 14 min if Render cron is unavailable).
# After deploy, add repo secrets: BACKEND_URL, FRONTEND_URL (full https URLs).

name: Keep services awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and frontend
        run: |
          curl -fsS "${{ secrets.BACKEND_URL }}/health"
          curl -fsS "${{ secrets.FRONTEND_URL }}"
