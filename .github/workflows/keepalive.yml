# Free backup keep-alive (runs every 14 min if Render cron is unavailable).
# Optional repo secrets override defaults: BACKEND_URL, FRONTEND_URL (full https URLs).

name: Keep services awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend and frontend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          set -euo pipefail

          backend="${BACKEND_URL:-https://deck-backend.onrender.com}"
          frontend="${FRONTEND_URL:-https://deck-frontend.onrender.com}"
          backend="${backend%/}"
          frontend="${frontend%/}"

          if [ -z "$backend" ] || [ -z "$frontend" ]; then
            echo "::error::Missing BACKEND_URL or FRONTEND_URL."
            exit 1
          fi

          ping_url() {
            local url="$1"
            local label="$2"
            echo "Pinging $label: $url"
            for attempt in 1 2 3; do
              if curl -fsS --connect-timeout 20 --max-time 90 "$url"; then
                echo ""
                return 0
              fi
              echo "Attempt $attempt failed for $label"
              [ "$attempt" -lt 3 ] && sleep 15
            done
            echo "::error::Could not reach $label at $url (Render may be cold-starting or down)"
            return 1
          }

          ping_url "$backend/health" "backend"
          ping_url "$frontend" "frontend"
